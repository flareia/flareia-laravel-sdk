name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: flareia/flareia-php-sdk
          path: flareia-php-sdk

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - run: composer config repositories.flareia-php path flareia-php-sdk
      - run: composer update --no-interaction --prefer-dist
      - run: ./vendor/bin/pest
